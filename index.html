<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0e13">
<title>B3A Bus Board</title>
<style>
  :root {
    --bg: #0a0e13;
    --panel: #121820;
    --panel-2: #0e141b;
    --line: #1f2937;
    --text: #e5e7eb;
    --muted: #8b98a9;
    --amber: #ffb020;
    --green: #22c55e;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: radial-gradient(1200px 600px at 50% -10%, #16202b 0%, var(--bg) 55%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh;
    padding: max(16px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
    display: flex;
    justify-content: center;
  }
  .app { width: 100%; max-width: 560px; }

  header {
    display: flex;
    align-items: center;
    gap: 14px;
    margin: 8px 0 18px;
  }
  .route-badge {
    flex: 0 0 auto;
    background: var(--amber);
    color: #111;
    font-weight: 800;
    font-size: 22px;
    letter-spacing: 0.5px;
    padding: 10px 14px;
    border-radius: 14px;
    box-shadow: 0 6px 20px rgba(255, 176, 32, 0.25);
  }
  .route-info { flex: 1 1 auto; min-width: 0; }
  .route-info h1 {
    margin: 0;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 0.3px;
  }
  .route-info p {
    margin: 3px 0 0;
    color: var(--muted);
    font-size: 13px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .live {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--green);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1px;
  }
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 10px var(--green);
    animation: pulse 1.8s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }

  .clock-card {
    background: linear-gradient(180deg, var(--panel), var(--panel-2));
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 16px 18px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 14px;
  }
  .clock {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 40px;
    font-weight: 700;
    letter-spacing: 2px;
    color: var(--amber);
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }
  .date { color: var(--muted); font-size: 13px; text-align: right; line-height: 1.4; }

  .next-card {
    background: linear-gradient(180deg, #14202c, #0f1822);
    border: 1px solid #1e3a52;
    border-radius: 18px;
    padding: 14px 18px;
    margin-bottom: 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .next-label { color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: 1.2px; }
  .next-value {
    font-size: 26px;
    font-weight: 800;
    color: var(--text);
    font-variant-numeric: tabular-nums;
  }
  .next-value small { font-size: 14px; font-weight: 600; color: var(--muted); margin-left: 4px; }

  .board {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 18px;
    overflow: hidden;
    margin-bottom: 18px;
  }
  .board-head, .row {
    display: grid;
    grid-template-columns: 84px 1fr 64px;
    align-items: center;
    gap: 10px;
    padding: 12px 16px;
  }
  .board-head {
    background: #0d131a;
    color: var(--muted);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1.4px;
    border-bottom: 1px solid var(--line);
  }
  .board-head span:last-child, .row .in { text-align: right; }
  .row { border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: none; }
  .row .time {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 20px;
    font-weight: 700;
    color: var(--amber);
    font-variant-numeric: tabular-nums;
  }
  .row .dest { font-size: 15px; color: var(--text); }
  .row .dest small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
  .row .in {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 15px;
    font-weight: 700;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .row .in.now { color: var(--green); }
  .row.next-row { background: rgba(255, 176, 32, 0.06); }

  .stops {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 16px 18px;
    margin-bottom: 18px;
  }
  .stops h2 {
    margin: 0 0 12px;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 1.4px;
    color: var(--muted);
  }
  .stops ol { margin: 0; padding: 0; list-style: none; position: relative; }
  .stops li {
    position: relative;
    padding: 0 0 16px 26px;
    font-size: 14px;
    color: var(--text);
  }
  .stops li:last-child { padding-bottom: 0; }
  .stops li::before {
    content: "";
    position: absolute;
    left: 4px; top: 4px;
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--panel);
    border: 2px solid var(--amber);
  }
  .stops li:last-child::before { background: var(--amber); }
  .stops li::after {
    content: "";
    position: absolute;
    left: 9px; top: 16px; bottom: 0;
    width: 2px;
    background: var(--line);
  }
  .stops li:last-child::after { display: none; }
  .stops li small { color: var(--muted); margin-left: 6px; }

  footer {
    text-align: center;
    color: var(--muted);
    font-size: 12px;
    line-height: 1.6;
  }
  footer a { color: var(--muted); }

  @media (max-width: 360px) {
    .clock { font-size: 32px; }
    .board-head, .row { grid-template-columns: 72px 1fr 56px; padding: 11px 12px; }
  }
</style>
</head>
<body>
  <main class="app">
    <header>
      <div class="route-badge">B3A</div>
      <div class="route-info">
        <h1>Bus Board</h1>
        <p>Campus &harr; City Centre</p>
      </div>
      <div class="live"><span class="dot"></span>LIVE</div>
    </header>

    <section class="clock-card" aria-label="Current time">
      <div class="clock" id="clock">--:--:--</div>
      <div class="date" id="date"></div>
    </section>

    <section class="next-card" aria-live="polite">
      <div>
        <div class="next-label">Next departure</div>
        <div class="next-value" id="nextValue">--</div>
      </div>
      <div class="next-label" id="nextAt">&nbsp;</div>
    </section>

    <section class="board" aria-label="Upcoming departures">
      <div class="board-head">
        <span>Departs</span>
        <span>Destination</span>
        <span>In</span>
      </div>
      <div id="rows"></div>
    </section>

    <section class="stops" aria-label="Route stops">
      <h2>Route stops</h2>
      <ol>
        <li>Campus Gate</li>
        <li>Library <small>3 min</small></li>
        <li>Riverside <small>7 min</small></li>
        <li>Market Square <small>12 min</small></li>
        <li>City Centre <small>18 min</small></li>
      </ol>
    </section>

    <footer>
      Demo timetable &middot; updates automatically every minute<br>
      B3A Bus Board
    </footer>
  </main>

<script>
  // ---- Timetable (edit these to match your real bus schedule) ----
  var FIRST_MIN = 6 * 60;   // 06:00
  var LAST_MIN  = 23 * 60;  // 23:00
  var INTERVAL  = 15;       // every 15 minutes
  var DEST      = "City Centre";

  function pad(n) { return n < 10 ? "0" + n : "" + n; }

  function departures(now) {
    var list = [];
    for (var d = 0; d < 2; d++) {
      var base = new Date(now.getFullYear(), now.getMonth(), now.getDate() + d, 0, 0, 0, 0);
      for (var m = FIRST_MIN; m <= LAST_MIN; m += INTERVAL) {
        var t = new Date(base.getTime() + m * 60000);
        if (t > now) list.push(t);
      }
    }
    list.sort(function (a, b) { return a - b; });
    return list;
  }

  function minsUntil(t, now) {
    return Math.max(0, Math.round((t - now) / 60000));
  }

  function render() {
    var now = new Date();

    // Clock
    document.getElementById("clock").textContent =
      pad(now.getHours()) + ":" + pad(now.getMinutes()) + ":" + pad(now.getSeconds());

    // Date
    var opts = { weekday: "short", month: "short", day: "numeric" };
    document.getElementById("date").textContent = now.toLocaleDateString(undefined, opts);

    // Departures
    var deps = departures(now).slice(0, 6);
    var rows = document.getElementById("rows");
    rows.innerHTML = "";

    if (!deps.length) {
      rows.innerHTML = '<div class="row"><div class="time">--:--</div><div class="dest">No more buses today</div><div class="in">--</div></div>';
      document.getElementById("nextValue").textContent = "--";
      document.getElementById("nextAt").textContent = "";
      return;
    }

    var next = deps[0];
    var m = minsUntil(next, now);
    var nextValue = document.getElementById("nextValue");
    nextValue.innerHTML = (m <= 0 ? "Now" : m + " <small>min</small>");
    document.getElementById("nextAt").textContent =
      "at " + pad(next.getHours()) + ":" + pad(next.getMinutes());

    deps.forEach(function (t, i) {
      var diff = minsUntil(t, now);
      var row = document.createElement("div");
      row.className = "row" + (i === 0 ? " next-row" : "");
      row.innerHTML =
        '<div class="time">' + pad(t.getHours()) + ":" + pad(t.getMinutes()) + "</div>" +
        '<div class="dest">' + DEST + (i === 0 ? "<small>Next bus</small>" : "") + "</div>" +
        '<div class="in' + (diff <= 0 ? " now" : "") + '">' +
          (diff <= 0 ? "Now" : diff + " min") +
        "</div>";
      rows.appendChild(row);
    });
  }

  render();
  setInterval(render, 1000);
</script>
</body>
</html>
